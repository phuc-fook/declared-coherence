name: test

"on":
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Build wheel
        run: python -m pip wheel . --no-deps --no-build-isolation --wheel-dir dist
      - name: Install wheel
        run: python -m pip install --force-reinstall dist/*.whl
      - name: Run public tests
        run: python -m unittest discover -s tests -v
      - name: Installed package smoke test
        run: python -c "import declared_coherence; assert declared_coherence.validate"
